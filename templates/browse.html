<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DropLAN</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/browse.css">
</head>
<body>
  <div class="container">
    <!-- 目录列表 -->
    <div id="dirsView" class="active">
      <a class="nav-back" href="/">返回首页</a>
      <div class="loading" id="dirsLoading">加载中...</div>
      <div class="dirs-grid" id="dirsList"></div>
      <div class="empty" id="dirsEmpty" style="display:none;"><span class="emoji"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>暂无目录，先去上传一些文件吧</div>
    </div>

    <!-- 文件列表 -->
    <div id="filesView">
      <div class="files-nav">
        <a class="nav-back" href="/">返回首页</a>
        <a class="nav-back" href="javascript:backToDirs()">返回目录列表</a>
      </div>
      <div class="cur-dir">当前目录 · <span id="currentDir"></span></div>
      <div class="batch-bar" id="batchBar" style="display:none;">
        <label class="select-all">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)">
          <span>全选</span>
        </label>
        <div class="batch-actions">
          <button class="btn-batch btn-selected" id="btnSelected" onclick="downloadSelected(this)" disabled>下载选中 (<span id="selectedCount">0</span>)</button>
          <button class="btn-batch btn-all" onclick="downloadAll(this)">全部下载</button>
        </div>
      </div>
      <div class="loading" id="filesLoading">加载中...</div>
      <div class="files-grid" id="filesList"></div>
      <div class="empty" id="filesEmpty" style="display:none;"><span class="emoji"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>该目录下暂无文件</div>
    </div>

    <div class="author-tip">💡 The Power From Ai! Directed by Yang Guangqing!</div>
  </div>

  <!-- 灯箱预览 -->
  <div id="lightbox" class="lightbox">
    <div class="lb-backdrop" onclick="closeLightbox()"></div>
    <img id="lbImg" class="lb-media" alt="">
    <video id="lbVideo" class="lb-media" controls></video>
    <button id="lbPrev" class="lb-nav lb-prev" onclick="lbNav(-1)">‹</button>
    <button id="lbNext" class="lb-nav lb-next" onclick="lbNav(1)">›</button>
    <button class="lb-close" onclick="closeLightbox()">✕</button>
    <div class="lb-bar">
      <span id="lbCounter"></span>
      <span id="lbName"></span>
      <button id="lbDownload" class="lb-download" onclick="lbDownload()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 下载</button>
    </div>
  </div>
  <script src="/static/browse.js"></script>
</body>
</html>
