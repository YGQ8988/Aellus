<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aellus</title>
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/common.css">
<link rel="stylesheet" href="/static/css/browse.css">
<link rel="stylesheet" href="/static/css/components.css">
</head>
<body>
  <!-- 目录列表 -->
  <div id="dirsView" class="active">
    <div class="top-bar">
      <div class="top-bar-inner">
      <nav class="breadcrumb">
        <a class="bc-link bc-home" href="/" onclick="clearAellusDir()">← 返回首页</a>
        <span class="bc-sep">/</span>
        <span class="bc-cur">目录</span>
      </nav>
      <div class="batch-bar" id="dirsBatchBar" style="display:none;">
        <label class="select-all">
          <input type="checkbox" id="selectAllDirs" class="checkbox" onchange="toggleSelectAll(this.checked, 'dirsList')">
          <span>全选</span>
        </label>
        <div class="batch-actions">
          <button class="btn-batch btn-selected" id="btnDownloadDirs" onclick="downloadSelectedDirs(this)" disabled>下载</button>
          <button class="btn-batch btn-del-selected" id="btnDelDirs" onclick="deleteSelectedDirs(this)" disabled>删除</button>
        </div>
      </div>
      </div>
    </div>
    <div class="container">
      <div class="loading" id="dirsLoading">加载中...</div>
      <div class="dirs-grid" id="dirsList"></div>
      <div class="empty" id="dirsEmpty" style="display:none;"><span class="emoji"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>暂无目录，先去上传一些文件吧</div>
    </div>
  </div>

  <!-- 文件列表 -->
  <div id="filesView">
    <div class="top-bar">
      <div class="top-bar-inner">
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <div class="batch-bar" id="batchBar" style="display:none;">
        <label class="select-all">
          <input type="checkbox" id="selectAll" class="checkbox" onchange="toggleSelectAll(this.checked, 'filesList')">
          <span>全选</span>
        </label>
        <div class="batch-actions">
          <button class="btn-batch btn-selected" id="btnSelected" onclick="downloadSelected(this)" disabled>下载</button>
          <button class="btn-batch btn-del-selected" id="btnDelSelected" onclick="deleteSelected(this)" disabled>删除</button>
        </div>
      </div>
      </div>
    </div>
    <div class="container">
      <div class="loading" id="filesLoading">加载中...</div>
      <div class="files-grid" id="filesList"></div>
      <div class="empty" id="filesEmpty" style="display:none;"><span class="emoji"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></span>该目录下暂无文件</div>
    </div>
  </div>

  <!-- 灯箱预览 -->
  <div id="lightbox" class="lightbox">
    <div class="lb-backdrop"></div>
    <img id="lbImg" class="lb-media" alt="">
    <video id="lbVideo" class="lb-media" controls></video>
    <button id="lbPrev" class="lb-nav lb-prev" onclick="lbNav(-1)"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" class="text-[28px]"><path fill-rule="evenodd" clip-rule="evenodd" d="M8.293 13.207a1 1 0 010-1.414l5.5-5.5a1 1 0 111.414 1.414L10.414 12.5l4.793 4.793a1 1 0 01-1.414 1.414l-5.5-5.5z"></path></svg></button>
    <button id="lbNext" class="lb-nav lb-next" onclick="lbNav(1)"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor" class="text-[28px]"><path fill-rule="evenodd" clip-rule="evenodd" d="M15.457 11.543a1 1 0 010 1.414l-5.5 5.5a1 1 0 01-1.414-1.414l4.793-4.793-4.793-4.793a1 1 0 011.414-1.414l5.5 5.5z"></path></svg></button>
    <button id="lbClose" class="lb-top-btn lb-close-left" onclick="closeLightbox()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    <div class="lb-topbar">
      <button id="lbDownload" class="lb-top-btn" onclick="lbDownload()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
      <button id="lbDelete" class="lb-top-btn" onclick="lbDelete()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </div>
  <script src="/static/js/ui.js"></script>
  <script src="/static/js/browse.js"></script>
</body>
</html>
