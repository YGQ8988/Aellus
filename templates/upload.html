<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DropLAN</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/upload.css">
</head>
<body>
  <div class="container">
    <div class="upload-wrap">
      <a class="nav-back" href="/">← 返回首页</a>
      <h1>📤 上传到电脑</h1>

      <div class="card">
        <label>设备名称（用于分目录）</label>
        <input type="text" id="device" placeholder="如：iPhone-测试机A / vivo-Y9">
      </div>

      <div class="card">
        <label>选择文件（支持多选，可从相册选截图/录屏）</label>
        <div class="actions">
          <button class="btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
        </div>
        <div class="actions">
          <button class="btn-cam" onclick="document.getElementById('camInput').click()">📸 拍照</button>
          <button class="btn-rec" onclick="document.getElementById('recInput').click()">🎥 录像</button>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
        <input type="file" id="camInput" accept="image/*" capture="environment">
        <input type="file" id="recInput" accept="video/*" capture="environment">
        <div id="progress"><div></div></div>
        <div id="status"></div>
      </div>

      <div class="result" id="result"></div>
      <div class="tip">
        文件自动保存到电脑桌面 <b>file-drops/&lt;设备名&gt;/</b> 目录<br>
        文件名自动加时间戳，不会覆盖
      </div>
      <div class="author-tip">💡 The Power From Ai! Directed by Yang Guangqing!</div>
    </div>
  </div>
  <script src="/static/upload.js"></script>
</body>
</html>
