<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aellus</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/upload.css">
</head>
<body>
  <div class="container">
    <div class="upload-wrap">
      <a class="nav-back" href="/">返回首页</a>
      <h1><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 上传到电脑</h1>

      <div class="card">
        <label>设备名称（用于分目录）</label>
        <input type="text" id="device" placeholder="如：iPhone-测试机A / vivo-Y9">
      </div>

      <div class="card">
        <label>选择文件（支持多选，可从相册选截图/录屏）</label>
        <div class="actions">
          <button class="btn-primary" onclick="document.getElementById('fileInput').click()">选择文件</button>
        </div>
        <div class="actions">
          <button class="btn-cam" onclick="document.getElementById('camInput').click()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 拍照</button>
          <button class="btn-rec" onclick="document.getElementById('recInput').click()"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg> 录像</button>
        </div>
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
        <input type="file" id="camInput" accept="image/*" capture="environment">
        <input type="file" id="recInput" accept="video/*" capture="environment">
        <div id="progress"><div></div></div>
        <div id="status"></div>
      </div>

      <div class="result" id="result"></div>
      <div class="tip">
        文件自动保存到电脑桌面 <b>aellus-drops/&lt;设备名&gt;/</b> 目录<br>
        文件名自动加时间戳，不会覆盖
      </div>
      <div class="author-tip"><div>Power comes from AI</div><div>The design comes from Yang Guangqing!</div><div>The style comes from Yang Junwen!</div></div>
    </div>
  </div>
  <script src="/static/upload.js"></script>
</body>
</html>
