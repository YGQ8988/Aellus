<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Aellus</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/home.css">
</head>
<body>
  <div class="container">
    <h1>Aellus</h1>
    <div class="app-icon-wrap">
      <img class="app-icon" id="appIcon" src="/static/favicon.svg" alt="Aellus" width="72" height="72" role="button" tabindex="0" aria-label="点击查看关于与赞赏">
      <div class="app-icon-hint">点我点我～～～</div>
    </div>
    <div class="subtitle"><svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> ↔ <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="2" y1="20" x2="22" y2="20"/></svg> 局域网文件互传 · 上传 / 读取 / 下载 · 更安全</div>
    <div class="access-bar">
      <svg class="icon link-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
      <span class="access-url" id="accessUrl">加载中…</span>
      <button class="copy-btn" id="copyBtn" type="button">
        <svg class="icon ico-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <svg class="icon ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
      <button class="qr-btn" id="qrBtn" type="button" title="扫码访问">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="14"/><line x1="17" y1="14" x2="21" y2="14"/><line x1="14" y1="17" x2="14" y2="21"/><line x1="17" y1="17" x2="17" y2="17"/><line x1="21" y1="17" x2="21" y2="21"/><line x1="17" y1="21" x2="17" y2="21"/></svg>
      </button>
    </div>
    <div class="home-grid">
      <a class="entry upload" href="/upload">
        <div class="folder">
          <div class="folder-back"></div>
          <div class="folder-front">
            <div class="folder-badge">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            </div>
          </div>
        </div>
        <div class="title">上传文件</div>
        <div class="desc">截图 / 录屏 / 拍照，发送到电脑</div>
      </a>
      <a class="entry browse" href="/browse">
        <div class="folder">
          <div class="folder-back"></div>
          <div class="folder-front">
            <div class="folder-badge">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>
        </div>
        <div class="title">读取文件</div>
        <div class="desc">浏览已上传的文件，支持下载</div>
      </a>
    </div>
    <div class="author-tip" id="authorTip">
      <span class="author-text">The Power From AI!</span>
    </div>
  </div>

  <!-- 二维码弹窗 -->
  <div class="qr-modal" id="qrModal">
    <div class="qr-backdrop" id="qrBackdrop"></div>
    <div class="qr-card">
      <button class="qr-close" id="qrClose" type="button">✕</button>
      <div class="qr-title">扫码访问</div>
      <div class="qr-img" id="qrImg"></div>
      <div class="qr-url" id="qrUrlText"></div>
      <div class="qr-hint">用手机相机或扫码 App 扫描上方二维码</div>
    </div>
  </div>

  <!-- 信息弹窗（点击图标）：本机显示存储目录，所有人显示赞赏 -->
  <div class="info-modal" id="infoModal">
    <div class="info-backdrop" id="infoBackdrop"></div>
    <div class="info-card">
      <button class="info-close" id="infoClose" type="button">✕</button>
      <div class="info-title">关于 Aellus</div>

      <!-- 存储目录（仅本机访问显示，JS fetch 成功才展开）-->
      <div class="info-section savedir-section" id="saveDirSection" style="display:none">
        <div class="info-section-title">存储目录</div>
        <div class="savedir-current">当前：<span id="saveDirCurrent"></span></div>
        <div class="savedir-edit">
          <input type="text" id="saveDirInput" placeholder="输入新的存储目录路径">
          <button id="saveDirApply" type="button">修改</button>
        </div>
        <button id="saveDirReset" class="savedir-reset" type="button">恢复默认</button>
        <div class="savedir-msg" id="saveDirMsg"></div>
      </div>

      <!-- 赏赏（所有人可见）-->
      <div class="info-section">
        <div class="info-section-title">请喝一杯咖啡</div>
        <div class="tip-text">如果觉得工具对您有帮助的话，可以请我们喝一杯咖啡吗？</div>
        <div class="qr-row">
          <div class="qr-item">
            <img src="/static/appreciation/dev_alipay.jpg" alt="开发者支付宝">
            <div class="qr-label">开发者 · 染洛凉</div>
          </div>
          <div class="qr-item">
            <img src="/static/appreciation/designer_alipay.jpg" alt="设计者支付宝">
            <div class="qr-label">设计者 · 一西啊</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="/static/qrcode.min.js"></script>
  <script src="/static/home.js"></script>
  <script src="/static/author-tip.js"></script>
</body>
</html>
